name: demo-go-service-llm-demo
language: go
target_coverage: 55

requirements:
  - "ValidateEmail должен возвращать ошибку для пустой строки"
  - "ValidateEmail должен возвращать ошибку для невалидного email"
  - "UserLabel должен возвращать ошибку при nil user"
  - "ReadFirstByte должен возвращать ошибку при отсутствии файла"
  - "ReadFirstByte должен возвращать первый байт файла"
  - "RemoveIfExists должен возвращать ошибку при отсутствии файла"
  - "RemoveIfExists должен удалять существующий файл без ошибки"

targets:
  - "internal/service/user.go:ValidateEmail"
  - "internal/service/user.go:UserLabel"
  - "internal/service/user.go:ReadFirstByte"
  - "internal/service/user.go:RemoveIfExists"

test_scenarios:
  - "empty input"
  - "invalid format"
  - "large input >10KB"
  - "nil dependencies"
  - "missing file"
  - "existing file"

agent_policy:
  min_fix_confidence: 0.8
  min_test_confidence: 0.7
  enabled_actions:
    - "apply_template_fix"
    - "apply_llm_fix"
    - "generate_test"
  enabled_categories:
    - "resource_management"
    - "error_handling"
    - "nil_safety"
    - "ignored_error"
  template_categories:
    - "resource_management"
    - "error_handling"
    - "nil_safety"
  llm_categories:
    - "ignored_error"
  llm_fallback_on_template_failure: true

llm:
  enabled: true
  provider: openai_compatible
  base_url: "https://openrouter.ai/api/v1"
  model: "openrouter/free"
  mode: "fallback"
  min_confidence: 0.75
  local_config_path: "./llm.local.yaml"